name: Create single-file PR from review comment
description: Consume the bridge artifact and create a split PR for a single file.

inputs:
  source_workflow:
    description: Name of the source workflow that emitted the bridge artifact
    required: true
  bridge_override_json:
    description: Internal test-only JSON object used instead of consuming the bridge artifact; not part of the supported public API
    required: false
    default: ''
  allow_pr_author:
    description: Whether to always allow the PR author to trigger splice-bot
    required: false
    default: 'true'
  min_repo_permission:
    description: Minimum repo permission allowed to trigger splice-bot (disabled, anyone, triage, write, maintain, admin)
    required: false
    default: 'anyone'
  allowed_teams:
    description: Optional comma/newline-separated team allowlist (team-slug or org/team-slug)
    required: false
    default: ''
  allowed_users:
    description: Optional comma/newline-separated GitHub login allowlist
    required: false
    default: ''
  label_commands:
    description: Optional JSON array of label command objects ({command|keyword, label?, comment?, allowed_args?, min_repo_permission?, allowed_users?, allowed_teams?, type?}); each command needs label and/or comment
    required: false
    default: ''
  push_to_fork:
    description: Optional fork target in owner/repo form for PR branches
    required: false
    default: ''
  maintainer_can_modify:
    description: Optional override for maintainer edits on fork PRs ("true" or "false")
    required: false
    default: ''
  base_ref:
    description: Base branch for the split PR; defaults to the original PR's base branch
    required: false
    default: ''
  committer:
    description: Committer of the split PR's commit, as "Display Name <email@address.com>"
    required: false
    default: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
  author:
    description: Author of the split PR's commit, as "Display Name <email@address.com>"; defaults to the original PR's author
    required: false
    default: ''
  pr_title:
    description: Title template for the split PR; supports {file_path}, {file_name}, {file_scope}, and {pr_number} placeholders
    required: false
    default: 'chore({file_path}): automated extraction'
  scope_strip_prefix:
    description: Path prefix removed from the {file_scope} placeholder (for example "Mathlib/")
    required: false
    default: ''
  token:
    description: Optional token used for artifact download, verification, checkout, and PR API calls; falls back to github.token
    required: false
    default: ''
  authz_token:
    description: Optional token used only for authorization checks
    required: false
    default: ''
  branch_token:
    description: Optional token used only to push PR branches
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The trigger workflow runs from the PR's merge commit, so for a fork PR
    # every value in the artifact may be forged. verify makes consume re-fetch
    # the review comment (by the artifact's comment id) and its PR from the
    # API, and check that the comment's author is the user whose event started
    # the trigger run. Only those verified values are exposed; raw artifact
    # values are withheld. The test-only bridge_override_json mode has no
    # trigger run to verify against, so it skips verify; in a real workflow_run
    # consume then rejects the untrusted producer.
    - name: Consume bridge artifact
      id: bridge
      uses: leanprover-community/privilege-escalation-bridge/consume@ccffab79ccf2cb6b105b858fa3e4735727cf4519 # v2.0.0
      with:
        token: ${{ inputs.token || github.token }}
        artifact: workflow-data
        source_workflow: ${{ inputs.source_workflow }}
        override_json: ${{ inputs.bridge_override_json }}
        require_event: pull_request_review_comment
        verify: ${{ inputs.bridge_override_json == '' }}
        fail_on_missing: false

    # Derives every value later steps act on from the verified comment and PR
    # (the base repo is this repository), and parses the trigger grammar from
    # the verified comment body. The split commit is the one the comment was
    # made on, which must still be the PR's head (see lib/trigger-context.js).
    # trigger_found == 'false' (trigger line gone, e.g. the comment was edited
    # after the event) is a clean no-op: every later step skips, including the
    # comment-back step.
    - name: Read trigger comment and PR
      id: trigger_context
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        ACTION_LIB_PATH: ${{ github.action_path }}/lib/trigger-context-step.js
        VERIFIED_JSON: ${{ steps.bridge.outputs.verified-json }}
        BASE_REPO: ${{ github.repository }}
        BASE_REF_INPUT: ${{ inputs.base_ref }}
        BRIDGE_OVERRIDE_MODE: ${{ inputs.bridge_override_json != '' }}
        BRIDGE_META_JSON: ${{ inputs.bridge_override_json != '' && steps.bridge.outputs.meta-json || '' }}
        BRIDGE_EVENT_JSON: ${{ inputs.bridge_override_json != '' && steps.bridge.outputs.event-json || '' }}
      with:
        github-token: ${{ inputs.token || github.token }}
        script: |
          const { runTriggerContextStep } = require(process.env.ACTION_LIB_PATH);
          await runTriggerContextStep({ core, github, env: process.env });

    - name: Authorize commenter
      if: steps.trigger_context.outputs.file_path != '' && steps.trigger_context.outputs.trigger_found == 'true'
      id: authorize_commenter
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        ACTION_LIB_PATH: ${{ github.action_path }}/lib/authorize-commenter-step.js
        ALLOW_PR_AUTHOR: ${{ inputs.allow_pr_author }}
        MIN_REPO_PERMISSION: ${{ inputs.min_repo_permission }}
        RAW_ALLOWED_TEAMS: ${{ inputs.allowed_teams }}
        RAW_ALLOWED_USERS: ${{ inputs.allowed_users }}
        COMMENTER_LOGIN: ${{ steps.trigger_context.outputs.commenter_login }}
        PR_AUTHOR_LOGIN: ${{ steps.trigger_context.outputs.pr_author_login }}
        BASE_REPO: ${{ steps.trigger_context.outputs.base_repo }}
        INPUT_TOKEN: ${{ inputs.token }}
        AUTHZ_TOKEN: ${{ inputs.authz_token }}
      with:
        github-token: ${{ inputs.authz_token || inputs.token || github.token }}
        script: |
          const run = require(process.env.ACTION_LIB_PATH);
          await run({ core, github, env: process.env });

    - name: Resolve configured trigger command
      if: steps.trigger_context.outputs.file_path != '' && steps.authorize_commenter.outcome == 'success'
      id: resolve_trigger_command
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        ACTION_LIB_PATH: ${{ github.action_path }}/lib/resolve-trigger-command-step.js
        RAW_LABEL_COMMANDS: ${{ inputs.label_commands }}
        TRIGGER_KEYWORD: ${{ steps.trigger_context.outputs.trigger_keyword }}
        TRIGGER_ARGS: ${{ steps.trigger_context.outputs.trigger_args }}
        COMMENTER_LOGIN: ${{ steps.trigger_context.outputs.commenter_login }}
        BASE_REPO: ${{ steps.trigger_context.outputs.base_repo }}
        INPUT_TOKEN: ${{ inputs.token }}
        AUTHZ_TOKEN: ${{ inputs.authz_token }}
      with:
        github-token: ${{ inputs.authz_token || inputs.token || github.token }}
        script: |
          const { runResolveAndAuthorizeCommandStep } = require(process.env.ACTION_LIB_PATH);
          await runResolveAndAuthorizeCommandStep({ core, github, env: process.env });

    - name: Check out BASE (PR base repo @ base_ref)
      if: steps.trigger_context.outputs.file_path != '' && steps.authorize_commenter.outcome == 'success' && steps.resolve_trigger_command.outcome == 'success'
      id: checkout_base
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        token: ${{ inputs.token || github.token }}
        repository: ${{ steps.trigger_context.outputs.base_repo }}
        ref: ${{ steps.trigger_context.outputs.base_ref }}
        fetch-depth: 0
        path: base

    - name: Check out HEAD (PR head repo)
      if: steps.trigger_context.outputs.file_path != '' && steps.authorize_commenter.outcome == 'success' && steps.resolve_trigger_command.outcome == 'success'
      id: checkout_head
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        token: ${{ inputs.token || github.token }}
        repository: ${{ steps.trigger_context.outputs.head_repo }}
        ref: ${{ steps.trigger_context.outputs.head_sha }}
        fetch-depth: 0
        path: head

    - name: Stage file changes via 3-way patch apply
      if: steps.trigger_context.outputs.file_path != '' && steps.authorize_commenter.outcome == 'success' && steps.resolve_trigger_command.outcome == 'success'
      id: branch_and_copy
      shell: bash
      env:
        FILE_PATH: ${{ steps.trigger_context.outputs.file_path }}
        PR_NUMBER: ${{ steps.trigger_context.outputs.pr_number }}
        BASE_REF: ${{ steps.trigger_context.outputs.base_ref }}
        HEAD_SHA: ${{ steps.trigger_context.outputs.head_sha }}
      run: |
        set -euo pipefail

        # Build a bounded, ref-safe slug from the file path.
        FILE_SLUG="$(printf '%s' "${FILE_PATH}" \
          | tr '/[:space:]' '-' \
          | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/\.\.+/./g; s/^[._-]+//; s/[._-]+$//; s/-+/-/g')"
        if [ -z "${FILE_SLUG}" ]; then
          FILE_SLUG="file"
        fi
        FILE_SLUG="${FILE_SLUG:0:80}"
        FILE_HASH="$(printf '%s' "${FILE_PATH}" | sha256sum | cut -c1-10)"
        BRANCH="splice-bot/pr-${PR_NUMBER}-${FILE_SLUG}-${FILE_HASH}"
        printf $'FILE_SLUG: %s\nFILE_HASH: %s\nBRANCH: %s\n' "${FILE_SLUG}" "${FILE_HASH}" "${BRANCH}"

        echo "BRANCH=$BRANCH" | tee -a "$GITHUB_OUTPUT"

        cd base

        git checkout "${BASE_REF}"

        # Import the PR head commit into this repo object graph so merge-base/diff can run reliably.
        git remote remove splice_head >/dev/null 2>&1 || true
        git remote add splice_head ../head
        git fetch --no-tags splice_head "${HEAD_SHA}"

        HEAD_COMMIT="$(git rev-parse FETCH_HEAD)"
        MERGE_BASE="$(git merge-base "${BASE_REF}" "${HEAD_COMMIT}" || true)"
        if [ -z "${MERGE_BASE}" ]; then
          echo "No merge-base found between ${BASE_REF} and ${HEAD_COMMIT}; cannot build patch."
          echo "APPLY_FAILED=true" | tee -a "$GITHUB_OUTPUT"
          exit 0
        fi

        PATCH_FILE="../splice-file.patch"
        git diff --binary --no-color "${MERGE_BASE}" "${HEAD_COMMIT}" -- "${FILE_PATH}" > "${PATCH_FILE}"

        if [ ! -s "${PATCH_FILE}" ]; then
          echo "No patch content for ${FILE_PATH} from ${MERGE_BASE}..${HEAD_COMMIT}"
          echo "NO_CHANGES=true" | tee -a "$GITHUB_OUTPUT"
          exit 0
        fi

        if ! git apply --3way --index "${PATCH_FILE}"; then
          echo "Patch apply failed for ${FILE_PATH}"
          echo "APPLY_FAILED=true" | tee -a "$GITHUB_OUTPUT"
          exit 0
        fi

        if git diff --cached --quiet; then
          echo "No changes staged for ${FILE_PATH} vs base ${BASE_REF}"
          echo "NO_CHANGES=true" | tee -a "$GITHUB_OUTPUT"
          exit 0
        fi

    - name: Validate create-pull-request inputs
      if: steps.trigger_context.outputs.file_path != '' && steps.authorize_commenter.outcome == 'success' && steps.resolve_trigger_command.outcome == 'success' && steps.branch_and_copy.outputs.NO_CHANGES != 'true' && steps.branch_and_copy.outputs.APPLY_FAILED != 'true'
      id: validate_cpr_inputs
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        PUSH_TO_FORK: ${{ inputs.push_to_fork }}
        MAINTAINER_CAN_MODIFY: ${{ inputs.maintainer_can_modify }}
        BRANCH_NAME: ${{ steps.branch_and_copy.outputs.BRANCH }}
        COMMITTER: ${{ inputs.committer }}
        AUTHOR: ${{ inputs.author }}
        PR_AUTHOR_LOGIN: ${{ steps.trigger_context.outputs.pr_author_login }}
        PR_TITLE_TEMPLATE: ${{ inputs.pr_title }}
        SCOPE_STRIP_PREFIX: ${{ inputs.scope_strip_prefix }}
        FILE_PATH: ${{ steps.trigger_context.outputs.file_path }}
        PR_NUMBER: ${{ steps.trigger_context.outputs.pr_number }}
        ACTION_LIB_PATH: ${{ github.action_path }}/lib/validate-cpr-inputs-step.js
      with:
        github-token: ${{ inputs.token || github.token }}
        script: |
          const { runValidateCprInputsStep } = require(process.env.ACTION_LIB_PATH);
          await runValidateCprInputsStep({ core, github, env: process.env });

    - name: Create Pull Request
      if: steps.trigger_context.outputs.file_path != '' && steps.authorize_commenter.outcome == 'success' && steps.resolve_trigger_command.outcome == 'success' && steps.branch_and_copy.outputs.NO_CHANGES != 'true' && steps.branch_and_copy.outputs.APPLY_FAILED != 'true' && steps.validate_cpr_inputs.outcome == 'success'
      id: cpr
      uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 #v8.0.0
      with:
        committer: ${{ inputs.committer }}
        author: ${{ steps.validate_cpr_inputs.outputs.author }}
        path: base
        base: ${{ steps.trigger_context.outputs.base_ref }}
        token: ${{ inputs.token || github.token }}
        # Fork-only options: when push_to_fork is empty, these resolve to empty strings and CPR uses base-repo branch mode.
        branch-token: ${{ inputs.push_to_fork != '' && (inputs.branch_token || inputs.token || github.token) || '' }}
        push-to-fork: ${{ inputs.push_to_fork != '' && inputs.push_to_fork || '' }}
        # CPR expects a strict boolean; treat any non-"true" value as false.
        maintainer-can-modify: ${{ inputs.maintainer_can_modify == 'true' }}
        commit-message: "Automated addition of changes in ${{ steps.trigger_context.outputs.file_path }}"
        title: ${{ steps.validate_cpr_inputs.outputs.pr_title }}
        body: >-
          This PR was automatically created from PR #${{ steps.trigger_context.outputs.pr_number }}
          by @${{ steps.trigger_context.outputs.pr_author_login }} via a
          [review comment](${{ github.server_url }}/${{ steps.trigger_context.outputs.base_repo }}/pull/${{ steps.trigger_context.outputs.pr_number }}#discussion_r${{ steps.trigger_context.outputs.review_comment_id }})
          by @${{ steps.trigger_context.outputs.commenter_login }}.
        branch: ${{ steps.branch_and_copy.outputs.BRANCH }}
        branch-suffix: random
        delete-branch: true

    - name: Apply label to split PR
      if: steps.cpr.outcome == 'success' && steps.resolve_trigger_command.outputs.trigger_mode == 'label' && steps.resolve_trigger_command.outputs.label_name != '' && steps.cpr.outputs.pull-request-number != ''
      id: apply_label
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        ACTION_LIB_PATH: ${{ github.action_path }}/lib/apply-label-step.js
        REPO_FULL: ${{ steps.trigger_context.outputs.base_repo }}
        LABEL_NAME: ${{ steps.resolve_trigger_command.outputs.label_name }}
        SPLIT_PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
      with:
        github-token: ${{ inputs.token || github.token }}
        script: |
          const run = require(process.env.ACTION_LIB_PATH);
          await run({ core, github, env: process.env });

    - name: Post comment on split PR
      # always() so a failed "Apply label" step does not skip the comment;
      # label and comment are attempted independently and reported separately.
      if: always() && steps.cpr.outcome == 'success' && steps.resolve_trigger_command.outputs.trigger_mode == 'label' && steps.resolve_trigger_command.outputs.comment_template != '' && steps.cpr.outputs.pull-request-number != ''
      id: post_split_pr_comment
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        ACTION_LIB_PATH: ${{ github.action_path }}/lib/post-split-pr-comment-step.js
        REPO_FULL: ${{ steps.trigger_context.outputs.base_repo }}
        COMMENT_TEMPLATE: ${{ steps.resolve_trigger_command.outputs.comment_template }}
        SPLIT_PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        FILE_PATH: ${{ steps.trigger_context.outputs.file_path }}
        PR_NUMBER: ${{ steps.trigger_context.outputs.pr_number }}
        COMMENTER_LOGIN: ${{ steps.trigger_context.outputs.commenter_login }}
        COMMAND_ARGS: ${{ steps.resolve_trigger_command.outputs.command_args }}
        EXTRA_COMMENT: ${{ steps.trigger_context.outputs.trigger_extra_text }}
        SCOPE_STRIP_PREFIX: ${{ inputs.scope_strip_prefix }}
      with:
        github-token: ${{ inputs.token || github.token }}
        script: |
          const run = require(process.env.ACTION_LIB_PATH);
          await run({ core, github, env: process.env });

    - name: Comment back on the original PR
      # Skips when there is no verified PR to report on (no artifact, or consume
      # failed verification), and when the comment no longer contains a trigger
      # line (nothing was requested, so nothing to report).
      if: always() && steps.trigger_context.outputs.pr_number != '' && steps.trigger_context.outputs.trigger_found != 'false'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        ACTION_LIB_PATH: ${{ github.action_path }}/lib/comment-back-step.js
        ORIGINAL_PR_NUMBER: ${{ steps.trigger_context.outputs.pr_number }}
        REVIEW_COMMENT_ID: ${{ steps.trigger_context.outputs.review_comment_id }}
        REPO_FULL: ${{ steps.trigger_context.outputs.base_repo }}
        CONTEXT_ERROR: ${{ steps.trigger_context.outputs.context_error }}
        TRIGGER_MODE: ${{ steps.resolve_trigger_command.outputs.trigger_mode }}
        TRIGGER_KEYWORD: ${{ steps.trigger_context.outputs.trigger_keyword }}
        TRIGGER_ARGS: ${{ steps.trigger_context.outputs.trigger_args }}
        TRIGGER_RESOLVE_ERROR: ${{ steps.resolve_trigger_command.outputs.resolve_error }}
        LABEL_COMMAND: ${{ steps.resolve_trigger_command.outputs.label_command }}
        LABEL_NAME: ${{ steps.resolve_trigger_command.outputs.label_name }}
        LABEL_APPLY_FAILED: ${{ steps.apply_label.outputs.label_apply_failed }}
        LABEL_APPLY_ERROR: ${{ steps.apply_label.outputs.label_apply_error }}
        COMMAND_COMMENT_TEMPLATE: ${{ steps.resolve_trigger_command.outputs.comment_template }}
        COMMENT_POST_FAILED: ${{ steps.post_split_pr_comment.outputs.comment_post_failed }}
        COMMENT_POST_ERROR: ${{ steps.post_split_pr_comment.outputs.comment_post_error }}
        FILE_PATH: ${{ steps.trigger_context.outputs.file_path }}
        APPLY_FAILED: ${{ steps.branch_and_copy.outputs.APPLY_FAILED }}
        NO_CHANGES: ${{ steps.branch_and_copy.outputs.NO_CHANGES }}
        AUTOMATED_PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        BASE_REF: ${{ steps.trigger_context.outputs.base_ref }}
        HEAD_REF: ${{ steps.trigger_context.outputs.head_ref }}
        HEAD_LABEL: ${{ steps.trigger_context.outputs.head_label }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        AUTHZ_OUTCOME: ${{ steps.authorize_commenter.outcome }}
        AUTHZ_DECISION: ${{ steps.authorize_commenter.outputs.authz_decision }}
        AUTHZ_REASON: ${{ steps.authorize_commenter.outputs.authz_reason }}
        AUTHZ_DETAILS: ${{ steps.authorize_commenter.outputs.authz_details }}
        LABEL_AUTHZ_OUTCOME: ${{ steps.resolve_trigger_command.outcome == 'failure' && steps.resolve_trigger_command.outputs.trigger_mode == 'label' && 'failure' || steps.resolve_trigger_command.outputs.label_authz_decision != '' && 'success' || '' }}
        LABEL_AUTHZ_DECISION: ${{ steps.resolve_trigger_command.outputs.label_authz_decision }}
        LABEL_AUTHZ_REASON: ${{ steps.resolve_trigger_command.outputs.label_authz_reason }}
        LABEL_AUTHZ_DETAILS: ${{ steps.resolve_trigger_command.outputs.label_authz_details }}
        LABEL_AUTHZ_TOKEN_SOURCE: ${{ steps.resolve_trigger_command.outputs.label_authz_token_source }}
        FORK_OWNER: ${{ steps.validate_cpr_inputs.outputs.fork_owner }}
        FORK_OWNER_TYPE: ${{ steps.validate_cpr_inputs.outputs.fork_owner_type }}
        INPUT_TOKEN: ${{ inputs.token }}
        AUTHZ_TOKEN: ${{ inputs.authz_token }}
        PUSH_TO_FORK: ${{ inputs.push_to_fork }}
        BRANCH_TOKEN: ${{ inputs.branch_token }}
        BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
        TRIGGER_CONTEXT_OUTCOME: ${{ steps.trigger_context.outcome }}
        RESOLVE_TRIGGER_COMMAND_OUTCOME: ${{ steps.resolve_trigger_command.outcome }}
        CHECKOUT_BASE_OUTCOME: ${{ steps.checkout_base.outcome }}
        CHECKOUT_HEAD_OUTCOME: ${{ steps.checkout_head.outcome }}
        AUTHORIZE_COMMENTER_OUTCOME: ${{ steps.authorize_commenter.outcome }}
        BRANCH_AND_COPY_OUTCOME: ${{ steps.branch_and_copy.outcome }}
        VALIDATE_CPR_INPUTS_OUTCOME: ${{ steps.validate_cpr_inputs.outcome }}
        CPR_OUTCOME: ${{ steps.cpr.outcome }}
        APPLY_LABEL_OUTCOME: ${{ steps.apply_label.outcome }}
        POST_SPLIT_PR_COMMENT_OUTCOME: ${{ steps.post_split_pr_comment.outcome }}
      with:
        github-token: ${{ inputs.token || github.token }}
        script: |
          const run = require(process.env.ACTION_LIB_PATH);
          await run({ core, github, env: process.env });
