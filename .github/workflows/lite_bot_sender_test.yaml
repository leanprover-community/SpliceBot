name: lite bot-sender test

# Throwaway: checks whether the pre-commit.ci lite app pushes a fix for a PR whose
# `opened` event came from a GitHub App rather than a user. Not for merging.
on: pull_request

permissions:
  contents: read

env:
  LITE_SHA: 5d6cc0eb514c891a40562a58a8e71576c5c7fb43

jobs:
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the sender
        env:
          SENDER_LOGIN: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: printf 'sender=%s (%s) actor=%s triggering_actor=%s\n' "$SENDER_LOGIN" "$SENDER_TYPE" "$ACTOR" "$TRIGGERING_ACTOR"

      # Always leave something to push, so that every run exercises the lite app.
      - name: Make a change
        run: printf 'run %s attempt %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > lite-test.txt

      # lite-action skips unless the event's `sender.type` is "User", and the runner rewrites
      # the event file before every step, so run the action's unmodified main.mjs in a child
      # process with GITHUB_EVENT_PATH pointing at a patched copy. Never for the lite app's
      # own pushes, which must stay skipped to avoid a loop.
      - name: Run lite-action's main.mjs with a User sender
        if: github.event.sender.type == 'Bot' && github.event.sender.login != 'pre-commit-ci-lite[bot]'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const dir = path.join(process.env.RUNNER_WORKSPACE, '..', '_actions',
              'pre-commit-ci', 'lite-action', process.env.LITE_SHA);
            if (!fs.existsSync(path.join(dir, 'main.mjs'))) {
              core.setFailed(`lite-action not found at ${dir}`);
              return;
            }
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            event.sender.type = 'User';
            const patched = path.join(process.env.RUNNER_TEMP, 'event-user-sender.json');
            fs.writeFileSync(patched, JSON.stringify(event));
            execFileSync('node', [path.join(dir, 'main.mjs')], {
              stdio: 'inherit',
              env: { ...process.env, GITHUB_EVENT_PATH: patched,
                     INPUT_MSG: '[pre-commit.ci lite] apply automatic fixes' },
            });

      # The real step, under its default name, which is how the app finds the job. For a
      # bot sender its main step skips, but its post step still runs because the step above
      # set PRE_COMMIT_CI_LITE_ARTIFACT.
      - uses: pre-commit-ci/lite-action@5d6cc0eb514c891a40562a58a8e71576c5c7fb43 # v1.1.0
        if: success() || failure()
